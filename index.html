<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CodeMate — Learn. Code. Build.</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#030b17;
    color:#fff;
}

/* ================= NAVBAR ================= */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    align-items:center;
    gap:25px;

    padding:16px 5%;

    background:rgba(3,11,23,.95);
    border-bottom:1px solid #17395f;
    backdrop-filter:blur(12px);
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:white;
    text-decoration:none;
}

.logo span{
    color:#ffd62e;
}

.logo code{
    color:#18d9ff;
}

.nav-links{
    display:flex;
    justify-content:center;
    gap:30px;
    flex:1;
}

.nav-links a{
    color:#aebbd0;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.nav-links a:hover{
    color:#ffd62e;
}

.search{
    width:190px;
    padding:10px 15px;

    border:1px solid #284c70;
    border-radius:25px;

    background:#061225;
    color:white;
    outline:none;
}

.btn{
    padding:10px 18px;
    border-radius:22px;
    border:1px solid #ffd62e;

    background:transparent;
    color:#ffd62e;

    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:linear-gradient(135deg,#ffe34a,#ffbd00);
    color:#111;
}

/* ================= CONTAINER ================= */

.container{
    width:min(1250px,92%);
    margin:auto;
}

/* ================= HERO ================= */

.hero{
    margin-top:20px;

    min-height:330px;

    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;

    padding:40px;

    border:1px solid #1d426b;
    border-radius:22px;

    background:
    radial-gradient(circle at 80% 50%,#14345a,transparent 35%),
    linear-gradient(135deg,#08172a,#061120);

    overflow:hidden;
}

.badge{
    display:inline-block;

    padding:8px 14px;

    margin-bottom:15px;

    border:1px solid #35557a;
    border-radius:20px;

    background:#0b1a2f;

    color:#dce7f4;
    font-size:12px;
}

.hero h1{
    font-size:50px;
    line-height:1.05;
    margin-bottom:18px;
}

.gradient{
    background:linear-gradient(
        90deg,
        #718cff,
        #18d9ff,
        #b8ee2c,
        #ffe02e
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    max-width:580px;

    color:#9fb0c7;

    font-size:16px;
    line-height:1.6;

    margin-bottom:25px;
}

.start-btn{
    padding:14px 23px;

    border:0;
    border-radius:25px;

    background:linear-gradient(
        135deg,
        #ffe23b,
        #ffbd00
    );

    color:#111;
    font-weight:bold;

    cursor:pointer;
}

/* ================= LAPTOP ================= */

.hero-art{
    display:flex;
    justify-content:center;
    align-items:center;
}

.laptop{
    width:330px;
    height:190px;

    border:4px solid #526b9d;
    border-radius:14px;

    background:#020914;

    box-shadow:0 0 40px #376cff55;
}

.screen{
    padding:15px;
}

.screen-top{
    height:20px;

    border-bottom:1px solid #263d61;
}

.dot{
    display:inline-block;

    width:7px;
    height:7px;

    margin-right:5px;

    border-radius:50%;

    background:#3985ff;
}

.code-line{
    height:7px;

    margin:13px 0;

    border-radius:5px;

    background:#7648ff;
}

.code-line:nth-child(2){
    width:70%;
    background:#18d9ff;
}

.code-line:nth-child(3){
    width:90%;
    background:#ffe02e;
}

.code-line:nth-child(4){
    width:55%;
    background:#42e878;
}

.code-line:nth-child(5){
    width:75%;
    background:#9a62ff;
}

/* ================= SECTION ================= */

section{
    margin-top:18px;
}

.section{
    padding:20px;

    border:1px solid #17395f;
    border-radius:20px;

    background:linear-gradient(
        145deg,
        #08172a,
        #061120
    );
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:18px;
}

.section-title{
    font-size:20px;
    font-weight:bold;
}

.section-subtitle{
    color:#91a4bd;
    font-size:12px;

    margin-top:5px;
}

/* ================= LANGUAGES ================= */

.languages{
    display:grid;

    grid-template-columns:
    repeat(8,1fr);

    gap:12px;
}

.language-card{
    min-height:125px;

    padding:15px 8px;

    text-align:center;

    border:1px solid #1a3a60;
    border-radius:14px;

    background:
    linear-gradient(
        145deg,
        #0b1d35,
        #071326
    );

    cursor:pointer;

    transition:.25s;
}

.language-card:hover{
    transform:translateY(-6px);

    border-color:#31aaff;

    box-shadow:0 15px 35px #0009;
}

.language-icon{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:auto;
    margin-bottom:10px;

    border-radius:13px;

    background:#081a31;
    border:1px solid #244b75;

    font-size:24px;
    font-weight:bold;
}

.language-card h3{
    font-size:14px;
    margin-bottom:5px;
}

.language-card p{
    color:#91a4bd;
    font-size:10px;
}

/* ================= FEATURE CARDS ================= */

.features{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:16px;
}

.feature{
    min-height:190px;

    padding:22px;

    border-radius:18px;

    background:#08162a;

    border:1px solid #315477;
}

.notes{
    border-color:#803de0;
}

.solver{
    border-color:#21ae69;
}

.feature-icon{
    width:42px;
    height:42px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:10px;

    margin-bottom:10px;

    background:#893cff;

    font-size:22px;
}

.solver .feature-icon{
    background:#20dc70;
    color:#021509;
}

.feature h2{
    font-size:19px;
}

.feature p{
    color:#91a4bd;
    font-size:12px;

    margin-top:5px;
}

.feature ul{
    margin:15px 0;

    list-style:none;
}

.feature li{
    color:#c5d0df;
    font-size:12px;

    margin:6px 0;
}

.feature li:before{
    content:"✓";
    color:#30e57a;
    margin-right:8px;
}

.feature-btn{
    padding:10px 18px;

    border:0;
    border-radius:20px;

    font-weight:bold;

    cursor:pointer;
}

.notes .feature-btn{
    background:#893cff;
    color:white;
}

.solver .feature-btn{
    background:#29dc68;
    color:#021509;
}

/* ================= COURSE ================= */

.course{
    display:none;
}

.topics{
    display:flex;
    flex-wrap:wrap;
    gap:8px;

    margin:15px 0;
}

.topic-btn{
    padding:8px 13px;

    border:1px solid #31567e;
    border-radius:8px;

    background:#071529;

    color:#c7d8ec;

    cursor:pointer;
}

.topic-btn:hover{
    border-color:#ffd62e;
    color:#ffd62e;
}

.code-box{
    padding:18px;

    background:#020812;

    border:1px solid #23466b;

    border-radius:12px;

    overflow:auto;
}

pre{
    color:#d7e4f5;

    font-family:
    "Courier New",
    monospace;

    line-height:1.5;

    white-space:pre-wrap;
}

.copy-btn{
    margin-top:12px;

    padding:10px 16px;

    border:1px solid #3b638d;
    border-radius:8px;

    background:#071529;

    color:white;

    cursor:pointer;
}

/* ================= WORKSPACE ================= */

.workspace{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:16px;
}

input,
textarea,
select{
    width:100%;

    padding:11px;

    border:1px solid #274767;
    border-radius:9px;

    background:#061225;
    color:white;

    outline:none;
}

textarea{
    min-height:120px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#39baff;
}

.save-btn{
    margin-top:10px;

    padding:10px 16px;

    border:0;
    border-radius:9px;

    background:linear-gradient(
        135deg,
        #ffe13a,
        #ffbd00
    );

    font-weight:bold;

    cursor:pointer;
}

.notes-list{
    margin-top:15px;

    display:grid;

    gap:8px;
}

.note{
    padding:12px;

    border:1px solid #254563;
    border-radius:9px;

    background:#061225;
}

.note small{
